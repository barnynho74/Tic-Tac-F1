<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula 1 Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formula 1 Tic-Tac-Toe</h1>

    
    <!-- Setup Screen -->
    <div class="game-container" id="setupScreen">
        <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Game Setup</h2>
        <h2 style="text-align: center;font-size: 18px; margin-bottom: 20px; color: #333;">1. Select the fields on left side
            <br> 2. Choose what remains available on top side</h2>
        
        <div style="display: flex; gap: 32px; justify-content: center; flex-wrap: wrap;">
            <!-- Left Side Teams Selection -->
            <div style="flex: 1; min-width: 300px;">
                <h3 style="text-align: center; color: #555; margin-bottom: 16px;">Select 3 Teams (Left Side)</h3>
                <input type="text" id="leftTeamSearch" placeholder="Search teams..." style="width: 100%; margin-bottom: 8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px;">
                    <div id="leftTeamsSelector" class="setup-grid"></div>
                </div>
                <div id="selectedLeftTeams" style="margin-top: 12px; padding: 8px; background: #f5f5f5; border-radius: 6px; min-height: 40px;">
                    <strong>Selected Left Teams (0/3):</strong>
                    <div id="selectedLeftTeamsList" style="margin-top: 4px; font-size: 0.9rem; color: #666;"></div>
                </div>
            </div>
            
            <!-- Top Teams Selection -->
            <div style="flex: 1; min-width: 300px;">
                <h3 style="text-align: center; color: #555; margin-bottom: 16px;">Select 3 Teams (Top)</h3>
                <input type="text" id="topTeamSearch" placeholder="Search teams..." style="width: 100%; margin-bottom: 8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px;">
                    <div id="topTeamsSelector" class="setup-grid"></div>
                </div>
                <div id="selectedTopTeams" style="margin-top: 12px; padding: 8px; background: #f5f5f5; border-radius: 6px; min-height: 40px;">
                    <strong>Selected Top Teams (0/3):</strong>
                    <div id="selectedTopTeamsList" style="margin-top: 4px; font-size: 0.9rem; color: #666;"></div>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 24px;">
            <div id="validationMessage" style="margin-bottom: 12px; min-height: 20px; font-size: 0.9rem;"></div>
            <button id="startGameBtn" style="padding: 12px 32px; font-size: 1rem;" disabled>Start Game</button>
            <button id="randomSelectionBtn" style="margin-left: 12px; background: linear-gradient(135deg, #9e9e9e, #757575);">Random Selection</button>
        </div>
        <div id="difficultySelectionContainer" class="button-container" style="display:none; margin-top: 12px;">
            <button class="difficulty-btn" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            <button class="difficulty-btn" data-difficulty="extreme">Extreme</button>
        </div>
    </div>
    
    <div style="margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;" id="gameControls" style="display: none;">
        <button id="toggleTooltipsBtn">Hide Tooltips</button>
        <button id="endAsDrawBtn">End as Draw</button>
        <button id="newGameBtn">New Game Setup</button>
    </div>
    
    <!-- Game Screen -->
     
    <div class="game-container" id="gameScreen" style="display: none;">
            <div id="winTracker" class="win-tracker">
        <span id="p1Tracker" class="player-tracker p1">P1</span>
        <span id="scoreTracker" class="score-tracker">0-0</span>
        <span id="p2Tracker" class="player-tracker p2">P2</span>
    </div>
        <div class="game-board-container">
            <div class="game-board" id="gameBoard">
                <!-- Game board will be generated by JavaScript -->
            </div>
        </div>
        <div class="input-area">
            <div class="player-turn p1" id="playerTurn">Player 1's Turn (Blue)</div>
            <div class="input-container">
                <input type="text" id="driverInput" placeholder="Enter driver's name" autocomplete="off">
                <div class="dropdown" id="driverDropdown"></div>
            </div>
            <div class="button-container">
                <button id="submitBtn">Submit Guess</button>
                <button id="skipBtn" class="skip-btn">Skip Turn</button>
            </div>
            <div class="message" id="message"></div>
        </div>
        
        <div class="winner" id="winner"></div>
    </div>

    <script src="drivers.js"></script>
    <script src="app.js"></script>
</body>
</html>
